deploymentMode: SingleBinary

singleBinary:
  replicas: 1

auth:
  enabled: false

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

monitoring:
  dashboards:
    enabled: false
  serviceMonitor:
    enabled: false

gateway:
  enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

persistence:
  enabled: false
